<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sorteio 1 a 8</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f0f0f0;
    padding-top: 40px;
  }
  button {
    margin-top: 20px;
    padding: 12px 25px;
    font-size: 18px;
    cursor: pointer;
  }
  #result {
    margin-top: 25px;
    font-size: 32px;
    font-weight: bold;
    color: #333;
  }
</style>
</head>
<body>

<h2>Sorteio de número entre 1 e 8</h2>

<button onclick="sortear()">Sortear</button>

<div id="result"></div>

<script>
  function sortear() {
    const result = document.getElementById('result');
    result.textContent = 'Sorteando...';

    setTimeout(() => {
      const numero = Math.floor(Math.random() * 8) + 1;
      result.textContent = 'Número sorteado: ' + numero;
    }, 800);
  }
</script>

</body>
</html>
