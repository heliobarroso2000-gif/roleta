<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roleta 1 a 8</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 20px;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      color: #1d1d1f;
      text-align: center;
    }
    .wheel-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
    }
    .wheel-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.12));
    }
    .pointer {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 28px solid #1d1d1f;
      z-index: 10;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }
    .center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 18px;
      height: 18px;
      background: #1d1d1f;
      border-radius: 50%;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    .spin-btn {
      font-family: inherit;
      font-size: 17px;
      font-weight: 600;
      padding: 12px 40px;
      border: none;
      border-radius: 12px;
      background: #1d1d1f;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    }
    .spin-btn:hover {
      background: #333;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.2);
    }
    .spin-btn:active {
      transform: translateY(0) scale(0.97);
    }
    .spin-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .result {
      font-size: 22px;
      font-weight: 600;
      color: #1d1d1f;
      min-height: 40px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .result-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #1d1d1f;
      color: #fff;
      font-weight: 700;
      font-size: 22px;
    }
    .footer {
      font-size: 13px;
      color: #86868b;
      margin-top: 8px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #000; }
      h1, .result { color: #f5f5f7; }
      .spin-btn { background: #f5f5f7; color: #000; }
      .spin-btn:hover { background: #e5e5e7; }
      .pointer { border-top-color: #f5f5f7; }
      .center-dot { background: #f5f5f7; }
      .result-number { background: #f5f5f7; color: #000; }
      .footer { color: #6e6e73; }
    }
  </style>
</head>
<body>
  <h1>Roleta 1 a 8</h1>
  <div class="wheel-wrapper">
    <div class="pointer"></div>
    <svg class="wheel-svg" viewBox="0 0 300 300" id="wheel"></svg>
    <div class="center-dot"></div>
  </div>
  <button class="spin-btn" id="spinBtn" onclick="spin()">Girar roleta</button>
  <div class="result" id="result"></div>
  <div class="footer">Gira 5 voltas completas antes de parar no número sorteado</div>

  <script>
    const svg = document.getElementById('wheel');
    const cx = 150, cy = 150, r = 140;
    const segments = 8;
    const colors = [
      '#007aff', '#ff3b30', '#34c759', '#af52de',
      '#8e8e93', '#007aff', '#ff3b30', '#34c759'
    ];

    for (let i = 0; i < segments; i++) {
      const startAngle = (i * 360 / segments - 90) * Math.PI / 180;
      const endAngle = ((i + 1) * 360 / segments - 90) * Math.PI / 180;
      const x1 = cx + r * Math.cos(startAngle);
      const y1 = cy + r * Math.sin(startAngle);
      const x2 = cx + r * Math.cos(endAngle);
      const y2 = cy + r * Math.sin(endAngle);
      const pathData = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2} Z`;

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', pathData);
      path.setAttribute('fill', colors[i]);
      path.setAttribute('stroke', '#fff');
      path.setAttribute('stroke-width', '2');
      svg.appendChild(path);

      const midAngle = (startAngle + endAngle) / 2;
      const labelR = r * 0.65;
      const lx = cx + labelR * Math.cos(midAngle);
      const ly = cy + labelR * Math.sin(midAngle);

      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', lx);
      text.setAttribute('y', ly);
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('dominant-baseline', 'middle');
      text.setAttribute('fill', '#fff');
      text.setAttribute('font-size', '28');
      text.setAttribute('font-weight', '700');
      text.setAttribute('font-family', 'inherit');
      text.textContent = i + 1;
      svg.appendChild(text);
    }

    const marker = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    marker.setAttribute('cx', cx + r * 0.82);
    marker.setAttribute('cy', cy - 5);
    marker.setAttribute('r', 7);
    marker.setAttribute('fill', '#fff');
    marker.setAttribute('stroke', '#1d1d1f');
    marker.setAttribute('stroke-width', '2');
    svg.appendChild(marker);

    const outerRing = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    outerRing.setAttribute('cx', cx);
    outerRing.setAttribute('cy', cy);
    outerRing.setAttribute('r', r);
    outerRing.setAttribute('fill', 'none');
    outerRing.setAttribute('stroke', '#1d1d1f');
    outerRing.setAttribute('stroke-width', '3');
    svg.appendChild(outerRing);

    let currentRotation = 0;
    let isSpinning = false;

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function spin() {
      if (isSpinning) return;
      isSpinning = true;
      document.getElementById('spinBtn').disabled = true;
      document.getElementById('result').innerHTML = '';

      const chosenSegment = Math.floor(Math.random() * segments);
      const segmentAngle = 360 / segments;
      const segmentCenter = chosenSegment * segmentAngle + segmentAngle / 2;

      const fiveRotations = 5 * 360;
      const currentMod = ((currentRotation % 360) + 360) % 360;
      let delta = (360 - ((currentMod + segmentCenter) % 360)) % 360;
      if (delta === 0) delta = 360;

      const totalRotation = fiveRotations + delta;
      const targetRotation = currentRotation + totalRotation;
      const duration = 6000;
      const startTime = performance.now();

      function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = easeOutCubic(progress);
        const current = currentRotation + totalRotation * eased;
        svg.style.transform = `rotate(${current}deg)`;

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          currentRotation = targetRotation;
          isSpinning = false;
          document.getElementById('spinBtn').disabled = false;
          const chosen = chosenSegment + 1;
          document.getElementById('result').innerHTML =
            'Resultado: <span class="result-number">' + chosen + '</span>';
        }
      }

      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
