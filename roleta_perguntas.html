<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Roleta 1 a 8</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f0f0f0;
        padding-top: 40px;
    }

    #wheel {
        width: 300px;
        height: 300px;
        border-radius: 50%;
        border: 10px solid #333;
        margin: 0 auto;
        position: relative;
        transition: transform 4s cubic-bezier(0.33, 1, 0.68, 1);
    }

    .slice {
        position: absolute;
        width: 0;
        height: 0;
        border-top: 150px solid transparent;
        border-bottom: 150px solid transparent;
        border-right: 150px solid red;
        left: 0;
        top: 0;
        transform-origin: 150px 150px;
        font-size: 22px;
        font-weight: bold;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #pointer {
        width: 0;
        height: 0;
        border-left: 20px solid transparent;
        border-right: 20px solid transparent;
        border-bottom: 30px solid red;
        margin: 20px auto;
    }

    button {
        margin-top: 20px;
        padding: 12px 25px;
        font-size: 18px;
        cursor: pointer;
    }

    #result {
        margin-top: 25px;
        font-size: 32px;
        font-weight: bold;
        color: #333;
        opacity: 0;
        transition: all 0.4s ease;
    }

    #result.pop {
        transform: scale(1.4);
        opacity: 1;
    }
</style>
</head>
<body>

<h2>Roleta 1 a 8</h2>

<div id="pointer"></div>
<div id="wheel"></div>

<button onclick="spinWheel()">Girar</button>

<div id="result"></div>

<audio id="sound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>

<script>
    const wheel = document.getElementById("wheel");
    const resultBox = document.getElementById("result");
    const sound = document.getElementById("sound");

    // Criar 8 fatias reais (triângulos)
    for (let i = 0; i < 8; i++) {
        const slice = document.createElement("div");
        slice.className = "slice";
        slice.style.borderRightColor = `hsl(${i * 45}, 70%, 50%)`;
        slice.style.transform = `rotate(${i * 45}deg)`;
        slice.textContent = i + 1;
        wheel.appendChild(slice);
    }

    function spinWheel() {
        resultBox.classList.remove("pop");
        resultBox.style.opacity = 0;

        const randomRotation = 3600 + Math.floor(Math.random() * 360);
        wheel.style.transform = `rotate(${randomRotation}deg)`;

        setTimeout(() => {
            const finalDeg = (randomRotation + 22.5) % 360;
            const selectedNumber = Math.floor(finalDeg / 45) + 1;

            resultBox.textContent = "Número sorteado: " + selectedNumber;
            resultBox.classList.add("pop");

            sound.play();
        }, 4000);
    }
</script>

</body>
</html>
