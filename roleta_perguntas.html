<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Roleta 1 a 8</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f0f0f0;
        padding-top: 40px;
    }

    #wheel {
        width: 300px;
        height: 300px;
        border-radius: 50%;
        border: 10px solid #333;
        margin: 0 auto;
        position: relative;
        overflow: hidden;
        transition: transform 4s cubic-bezier(0.33, 1, 0.68, 1);
    }

    .number {
        position: absolute;
        width: 50%;
        height: 50%;
        left: 50%;
        top: 50%;
        transform-origin: 0% 0%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 28px;
        font-weight: bold;
        color: white;
    }

    #pointer {
        width: 0;
        height: 0;
        border-left: 20px solid transparent;
        border-right: 20px solid transparent;
        border-bottom: 30px solid red;
        margin: 20px auto;
    }

    button {
        margin-top: 20px;
        padding: 12px 25px;
        font-size: 18px;
        cursor: pointer;
    }

    #result {
        margin-top: 25px;
        font-size: 32px;
        font-weight: bold;
        color: #333;
        opacity: 0;
        transition: all 0.4s ease;
    }

    #result.pop {
        transform: scale(1.4);
        opacity: 1;
    }
</style>
</head>
<body>

<h2>Roleta 1 a 8</h2>

<div id="pointer"></div>
<div id="wheel"></div>

<button onclick="spinWheel()">Girar</button>

<div id="result"></div>

<audio id="sound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>
